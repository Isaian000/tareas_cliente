<section class="page">
  <header class="page-header">
    <h1>Películas</h1>
    <p>{{ movies().length }} resultados</p>
  </header>

  <app-movie-filter [genres]="genres" (filtersChange)="onFiltersChange($event)" />

  <div class="grid" *ngIf="movies().length; else empty">
    <app-movie-card
      *ngFor="let movie of movies()"
      [movie]="movie"
      [favorite]="favoritesService.isFavorite(movie.id)"
      (favoriteToggle)="onFavoriteToggle($event)"
    />
  </div>

  <ng-template #empty>
    <p class="empty">No hay películas que coincidan con los filtros.</p>
  </ng-template>
</section>
